services:
  - type: web
    name: ai-student-learning-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PERSISTENT_DB_PATH
        value: /data/database.db
      - key: GROQ_API_KEY
        sync: false # You will enter your key when deploying
      - key: FLASK_SECRET_KEY
        generateValue: true
    disk:
      name: database-disk
      mountPath: /data
      sizeGB: 1
